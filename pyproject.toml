[project]
name = "responser-model-api"
version = "0.4.0"
description = "Local HTTP API that turns chat snapshots into replies using an Ollama-hosted LLM."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "ollama>=0.6.2",
    "pyyaml>=6.0",
    "emoji>=2.14,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "jsonschema>=4.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
